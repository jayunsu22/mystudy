<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반복학습</title>
<link rel="stylesheet" href="style.css?v=20260823">
</head>
<body>
<div id="app">
  <div class="top">
    <h1>🔁 반복학습</h1>
    <p id="topSubtitle">출근길엔 신규학습, 퇴근길엔 복습 — 모드를 선택하세요.</p>
  </div>

  <div class="card" id="card">
    <div id="view-home">
      <div class="stat-row" id="statRow"></div>
      <div class="modepick">
        <div style="text-align:center;">
          <button id="startNewBtn" class="bigbtn">🌱<br>신규학습</button>
        </div>
        <div style="text-align:center;">
          <button id="startReviewBtn" class="bigbtn">🔁<br>복습</button>
        </div>
      </div>
      <p class="small-note" style="margin-top:18px;">운전 중에는 정차 시 시작해 주세요. 이후 진행은 음성으로 이어집니다.</p>
      <div id="debugPanel" style="margin-top:16px; text-align:left; max-height:120px; overflow-y:auto; font-family:monospace; font-size:11px; color:var(--muted); background:#0d1526; padding:10px; border-radius:8px; white-space:pre-wrap; width:100%;"></div>
    </div>
  </div>

  <div class="footer-controls" id="footerControls" style="display:none;">
    <button id="btnRepeat">🔁 반복</button>
    <button id="btnNext">⏭ 다음</button>
    <button id="btnPause">⏸ 일시정지</button>
    <button id="btnStop" class="stop">⏹ 종료</button>
  </div>

  <p class="small-note" id="voiceHint" style="display:none;">음성 명령: "반복" · "다음" · "그만" (한국어 또는 영어 "repeat/next/stop")</p>
</div>

<div class="toast" id="toast"></div>

<script src="srs-utils.js?v=20260823"></script>
<script src="app.js?v=20260823b"></script>
</body>
</html>
